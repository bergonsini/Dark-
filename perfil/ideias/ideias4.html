<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Bangers;src:url(Bangers.woff2)}
@font-face{font-family:Baloo;src:url(Baloo2-800.woff2);font-weight:800}
body{margin:0;background:#000}.card{width:1080px;height:1080px}svg{display:block}
</style></head><body>

<!-- 13: explosão em fundo azul + nome -->
<div class="card" id="c13"><svg width="1080" height="1080">
<defs><radialGradient id="r13"><stop offset="0" stop-color="#4cc9f0"/><stop offset="1" stop-color="#1d3557"/></radialGradient></defs>
<rect width="1080" height="1080" fill="url(#r13)"/>
<g class="burst" data-cx="540" data-cy="470" data-r1="300" data-r2="410" data-n="20" data-fill="#ffd60a" data-rot="-6"></g>
<text x="540" y="530" text-anchor="middle" font-family="Bangers" font-size="220" fill="#e63946" stroke="#2a1608" stroke-width="16" paint-order="stroke" transform="rotate(-6 540 470)">LIGUE JÁ!</text>
<g transform="translate(540 820) rotate(-6)">
 <rect x="-340" y="-115" width="680" height="230" rx="28" fill="#2a1608" transform="translate(0 14)"/>
 <rect x="-340" y="-115" width="680" height="230" rx="28" fill="#fff" stroke="#2a1608" stroke-width="12"/>
 <text y="10" text-anchor="middle" font-family="Bangers" font-size="135" fill="#2a1608" letter-spacing="10">0800</text>
 <text y="90" text-anchor="middle" font-family="Baloo" font-weight="800" font-size="64" fill="#e63946" letter-spacing="4">INUTILIDADES</text>
</g>
</svg></div>

<!-- 14: com selos "GRÁTIS" e "SÓ HOJE" -->
<div class="card" id="c14"><svg width="1080" height="1080">
<defs><radialGradient id="r14"><stop offset="0" stop-color="#ff4d6d"/><stop offset="1" stop-color="#800f2f"/></radialGradient></defs>
<rect width="1080" height="1080" fill="url(#r14)"/>
<g class="burst" data-cx="540" data-cy="520" data-r1="290" data-r2="400" data-n="22" data-fill="#ffd60a" data-rot="-8"></g>
<text x="540" y="490" text-anchor="middle" font-family="Bangers" font-size="200" fill="#e63946" stroke="#2a1608" stroke-width="16" paint-order="stroke" transform="rotate(-8 540 520)">LIGUE JÁ!</text>
<text x="540" y="680" text-anchor="middle" font-family="Bangers" font-size="170" fill="#2a1608" letter-spacing="10" transform="rotate(-8 540 520)">0800</text>
<g class="burst" data-cx="790" data-cy="200" data-r1="92" data-r2="122" data-n="14" data-fill="#06d6a0" data-rot="12"></g>
<text x="790" y="222" text-anchor="middle" font-family="Bangers" font-size="62" fill="#fff" stroke="#2a1608" stroke-width="8" paint-order="stroke" transform="rotate(12 790 200)">GRÁTIS</text>
<g class="burst" data-cx="270" data-cy="210" data-r1="90" data-r2="120" data-n="14" data-fill="#fff" data-rot="-14"></g>
<text x="270" y="205" text-anchor="middle" font-family="Bangers" font-size="54" fill="#e63946" transform="rotate(-14 270 210)">SÓ</text>
<text x="270" y="255" text-anchor="middle" font-family="Bangers" font-size="54" fill="#e63946" transform="rotate(-14 270 210)">HOJE!</text>
<g transform="translate(540 850) rotate(-5)">
 <path d="M -400 -62 L 400 -62 L 355 0 L 400 62 L -400 62 L -355 0 Z" fill="#2a1608" transform="translate(0 12)"/>
 <path d="M -400 -62 L 400 -62 L 355 0 L 400 62 L -400 62 L -355 0 Z" fill="#fff" stroke="#2a1608" stroke-width="12" stroke-linejoin="round"/>
 <text y="24" text-anchor="middle" font-family="Baloo" font-weight="800" font-size="66" fill="#e63946" letter-spacing="3">INUTILIDADES</text>
</g>
</svg></div>

<!-- 15: estilo gibi, retícula + fone -->
<div class="card" id="c15"><svg width="1080" height="1080">
<defs><pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse"><circle cx="18" cy="18" r="8" fill="#ff9f1c"/></pattern></defs>
<rect width="1080" height="1080" fill="#ffd60a"/><rect width="1080" height="1080" fill="url(#dots)" opacity=".7"/>
<g class="burst" data-cx="540" data-cy="540" data-r1="330" data-r2="470" data-n="16" data-fill="#fff" data-rot="0" data-jag="1"></g>
<g transform="translate(540 240) rotate(170) scale(.4)" stroke="#2a1608" stroke-width="26" stroke-linejoin="round">
 <path d="M -260 -40 C -280 -140 -200 -170 -140 -150 L -110 -60 C -100 -30 -130 -10 -150 0 C -120 40 120 40 150 0 C 130 -10 100 -30 110 -60 L 140 -150 C 200 -170 280 -140 260 -40 C 230 80 -230 80 -260 -40 Z" fill="#e63946"/>
</g>
<text x="540" y="385" text-anchor="middle" font-family="Baloo" font-weight="800" font-size="58" fill="#2a1608" letter-spacing="3" transform="rotate(-5 540 540)">INUTILIDADES</text>
<text x="540" y="590" text-anchor="middle" font-family="Bangers" font-size="190" fill="#3a86ff" stroke="#2a1608" stroke-width="16" paint-order="stroke" transform="rotate(-5 540 540)">LIGUE JÁ!</text>
<text x="540" y="760" text-anchor="middle" font-family="Bangers" font-size="160" fill="#e63946" stroke="#2a1608" stroke-width="12" paint-order="stroke" letter-spacing="8" transform="rotate(-5 540 540)">0800</text>
</svg></div>

<!-- 16: explosão dupla + faixa -->
<div class="card" id="c16"><svg width="1080" height="1080">
<rect width="1080" height="1080" fill="#7209b7"/>
<g class="burst" data-cx="540" data-cy="520" data-r1="360" data-r2="470" data-n="24" data-fill="#ffd60a" data-rot="5"></g>
<g class="burst" data-cx="540" data-cy="520" data-r1="270" data-r2="330" data-n="24" data-fill="#e63946" data-rot="12"></g>
<text x="540" y="395" text-anchor="middle" font-family="Baloo" font-weight="800" font-size="52" fill="#fff" letter-spacing="2" transform="rotate(-4 540 520)">INUTILIDADES</text>
<text x="540" y="620" text-anchor="middle" font-family="Bangers" font-size="240" fill="#fff" stroke="#2a1608" stroke-width="16" paint-order="stroke" letter-spacing="6" transform="rotate(-4 540 520)">0800</text>
<g transform="translate(540 820) rotate(-4)">
 <path d="M -410 -70 L 410 -70 L 360 0 L 410 70 L -410 70 L -360 0 Z" fill="#2a1608" transform="translate(0 14)"/>
 <path d="M -410 -70 L 410 -70 L 360 0 L 410 70 L -410 70 L -360 0 Z" fill="#06d6a0" stroke="#2a1608" stroke-width="12" stroke-linejoin="round"/>
 <text y="45" text-anchor="middle" font-family="Bangers" font-size="125" fill="#fff" stroke="#2a1608" stroke-width="10" paint-order="stroke" letter-spacing="4">LIGUE JÁ!</text>
</g>
</svg></div>

<script>
document.querySelectorAll('.burst').forEach(g=>{const d=g.dataset,n=+d.n,cx=+d.cx,cy=+d.cy;let p='';
for(let i=0;i<n*2;i++){let r=i%2?+d.r1:+d.r2;if(d.jag&&i%2==0)r*=0.85+0.3*((i*37)%7)/7;const a=i/(n*2)*Math.PI*2;p+=(i?'L':'M')+(cx+r*Math.cos(a)).toFixed(1)+' '+(cy+r*Math.sin(a)).toFixed(1);}
g.innerHTML=`<path d="${p}Z" fill="#2a1608" transform="translate(0 16) rotate(${d.rot} ${cx} ${cy})"/><path d="${p}Z" fill="${d.fill}" stroke="#2a1608" stroke-width="16" stroke-linejoin="round" transform="rotate(${d.rot} ${cx} ${cy})"/>`;});
</script>
</body></html>
