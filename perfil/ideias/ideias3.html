<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Bangers;src:url(Bangers.woff2)}
@font-face{font-family:Baloo;src:url(Baloo2-800.woff2);font-weight:800}
body{margin:0;background:#000}.card{width:1080px;height:1080px}svg{display:block}
</style></head><body>

<!-- 9: Explosão "LIGUE JÁ!" -->
<div class="card" id="c9"><svg width="1080" height="1080">
<defs><radialGradient id="r9"><stop offset="0" stop-color="#ff4d6d"/><stop offset="1" stop-color="#a4133c"/></radialGradient></defs>
<rect width="1080" height="1080" fill="url(#r9)"/>
<g id="burst"></g>
<text x="540" y="560" text-anchor="middle" font-family="Bangers" font-size="230" fill="#e63946" stroke="#2a1608" stroke-width="16" paint-order="stroke" transform="rotate(-8 540 480)">LIGUE JÁ!</text>
<g transform="translate(540 820) rotate(-8)">
 <rect x="-300" y="-80" width="600" height="160" rx="24" fill="#2a1608" transform="translate(0 14)"/>
 <rect x="-300" y="-80" width="600" height="160" rx="24" fill="#fff" stroke="#2a1608" stroke-width="12"/>
 <text y="52" text-anchor="middle" font-family="Bangers" font-size="150" fill="#2a1608" letter-spacing="10">0800</text>
</g>
</svg></div>

<!-- 10: Telefone tocando -->
<div class="card" id="c10"><svg width="1080" height="1080">
<rect width="1080" height="1080" fill="#3a86ff"/>
<g stroke="#ffd60a" stroke-width="22" stroke-linecap="round" fill="none">
 <path d="M 250 330 Q 200 420 250 510"/><path d="M 170 280 Q 90 420 170 560"/>
 <path d="M 830 330 Q 880 420 830 510"/><path d="M 910 280 Q 990 420 910 560"/>
</g>
<g transform="translate(540 430) rotate(162)" stroke="#2a1608" stroke-width="18" stroke-linejoin="round">
 <path d="M -260 -40 C -280 -140 -200 -170 -140 -150 L -110 -60 C -100 -30 -130 -10 -150 0 C -120 40 120 40 150 0 C 130 -10 100 -30 110 -60 L 140 -150 C 200 -170 280 -140 260 -40 C 230 80 -230 80 -260 -40 Z" fill="#e63946"/>
</g>
<g transform="translate(540 805) rotate(-4)">
 <rect x="-420" y="-150" width="840" height="300" rx="40" fill="#2a1608" transform="translate(0 16)"/>
 <rect x="-420" y="-150" width="840" height="300" rx="40" fill="#ffd60a" stroke="#2a1608" stroke-width="14"/>
 <text y="-10" text-anchor="middle" font-family="Bangers" font-size="150" fill="#e63946" stroke="#2a1608" stroke-width="10" paint-order="stroke">LIGUE JÁ</text>
 <text y="115" text-anchor="middle" font-family="Bangers" font-size="110" fill="#2a1608" letter-spacing="10">0800</text>
</g>
</svg></div>

<!-- 11: Estilo comercial de TV -->
<div class="card" id="c11"><svg width="1080" height="1080">
<defs><linearGradient id="g11" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0033a0"/><stop offset="1" stop-color="#001233"/></linearGradient>
<linearGradient id="y11" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3b0"/><stop offset=".5" stop-color="#ffd60a"/><stop offset="1" stop-color="#ff9f1c"/></linearGradient></defs>
<rect width="1080" height="1080" fill="url(#g11)"/>
<g opacity=".12" fill="#fff"><path d="M540 540 L-200 -200 L200 -200Z"/><path d="M540 540 L880 -200 L1280 -200Z"/><path d="M540 540 L1280 700 L1280 1100Z"/><path d="M540 540 L-200 700 L-200 1100Z"/></g>
<text x="540" y="400" text-anchor="middle" font-family="Baloo" font-weight="800" font-size="190" font-style="italic" fill="url(#y11)" stroke="#2a1608" stroke-width="14" paint-order="stroke" transform="skewX(-10) translate(70 0)">LIGUE</text>
<text x="540" y="600" text-anchor="middle" font-family="Baloo" font-weight="800" font-size="230" fill="url(#y11)" stroke="#2a1608" stroke-width="14" paint-order="stroke" transform="skewX(-10) translate(100 0)">JÁ!</text>
<rect x="150" y="690" width="780" height="190" rx="20" fill="#e63946" stroke="#fff" stroke-width="12"/>
<text x="540" y="828" text-anchor="middle" font-family="Baloo" font-weight="800" font-size="130" fill="#fff" letter-spacing="6">0800</text>
</svg></div>

<!-- 12: Tela de chamada -->
<div class="card" id="c12"><svg width="1080" height="1080">
<rect width="1080" height="1080" fill="#8338ec"/>
<g transform="translate(540 560)">
 <rect x="-280" y="-470" width="560" height="940" rx="80" fill="#2a1608"/>
 <rect x="-250" y="-440" width="500" height="880" rx="60" fill="#111827"/>
 <text y="-300" text-anchor="middle" font-family="Baloo" font-weight="800" font-size="44" fill="#9ca3af">chamando...</text>
 <text y="-170" text-anchor="middle" font-family="Bangers" font-size="150" fill="#fff" letter-spacing="6">0800</text>
 <text y="-90" text-anchor="middle" font-family="Baloo" font-weight="800" font-size="50" fill="#ffd60a">INUTILIDADE</text>
 <circle cy="150" r="110" fill="#22c55e"/>
 <path d="M -50 115 C -60 95 -45 80 -30 85 L -18 115 C -14 125 -22 132 -28 136 C -18 156 2 176 22 186 C 26 180 33 172 43 176 L 73 188 C 78 203 63 218 43 208 C 5 196 -38 153 -50 115 Z" fill="#fff" transform="translate(-10 -10) scale(1.1)"/>
 <text y="345" text-anchor="middle" font-family="Bangers" font-size="110" fill="#22c55e" letter-spacing="4">LIGUE JÁ!</text>
</g>
</svg></div>
<script>
const g=document.getElementById('burst');let p='';const n=22,cx=540,cy=500;
for(let i=0;i<n*2;i++){const r=i%2?300:420,a=i/(n*2)*Math.PI*2;p+=(i?'L':'M')+(cx+r*Math.cos(a))+' '+(cy+r*Math.sin(a));}
g.innerHTML=`<path d="${p}Z" fill="#ffd60a" stroke="#2a1608" stroke-width="16" stroke-linejoin="round" transform="rotate(-8 540 500)"/>`;
</script>
</body></html>
